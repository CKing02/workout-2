name: P3 CacheKey

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'modules/**/android/build.gradle', 'patches/*.patch') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: echo ok
