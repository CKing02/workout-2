name: P1 Trigger

on:
  workflow_dispatch:
    inputs:
      abi:
        description: '目标 ABI（真机 BVL-AN00 是 arm64-v8a，AVD dl2_test 是 x86_64）'
        required: true
        default: 'arm64-v8a,x86_64'
        type: choice
        options:
          - 'arm64-v8a,x86_64'
          - 'arm64-v8a'
          - 'x86_64'

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ inputs.abi }}"
