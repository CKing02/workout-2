name: P4 FirstHalf

on:
  workflow_dispatch:
    inputs:
      abi:
        description: '目标 ABI'
        required: true
        default: 'arm64-v8a,x86_64'
        type: choice
        options:
          - 'arm64-v8a,x86_64'
          - 'arm64-v8a'
          - 'x86_64'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 腾磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
