name: P5 SecondHalf

on:
  workflow_dispatch:
    inputs:
      abi:
        description: '目标 ABI'
        required: true
        default: 'arm64-v8a,x86_64'
        type: choice
        options:
          - 'arm64-v8a,x86_64'
          - 'arm64-v8a'
          - 'x86_64'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 安装依赖
        run: npm ci --include=dev

      - name: 生成 android/ 工程
        run: npx expo prebuild --platform android --no-install

      - name: 构建 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PreactNativeArchitectures=${{ inputs.abi }} \
            --no-daemon

      - name: 收集产物信息
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          sha256sum android/app/build/outputs/apk/debug/*.apk | tee apk-sha256.txt

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ inputs.abi }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
